services:
  db:
    image: postgres:16-alpine
    container_name: gr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestion_restaurante
    ports:
      - "5432:5432"
    volumes:
      - gr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_restaurante"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gr-pgdata: